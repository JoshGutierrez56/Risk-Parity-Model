name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python run_risk_parity.py --synthetic --start 2022-01-01 --end 2024-01-01 --scorecard
